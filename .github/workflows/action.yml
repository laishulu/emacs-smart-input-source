name: CI

on:
  push:
    branches:
      - master
      - "ci/**"

  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 27.1
          - 28.2
          - 29.4
        ignore_warnings:
          - true
    steps:
      - uses: actions/checkout@v2
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - name: Run cursor regression tests
        run: emacs -Q --batch -L . -l test/sis-cursor-test.el -f ert-run-tests-batch-and-exit
      - uses: leotaku/elisp-check@master
        with:
          check: melpa
          file: "sis.el"
          ignore_warnings: false
          warnings_as_errors: false
